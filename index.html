<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>身份证照片处理工具 - 手动裁剪版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
            padding: 16px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; font-size: 1.4em; margin: 12px 0 4px; }
        .subtitle { text-align: center; color: #888; font-size: 0.85em; margin-bottom: 16px; }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .card h2 { font-size: 1em; margin-bottom: 12px; color: #555; }
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .upload-area:active { border-color: #4a90d9; background: #f8faff; }
        .upload-area input { display: none; }
        .upload-area .icon { font-size: 2em; margin-bottom: 6px; }
        .upload-area .text { color: #888; font-size: 0.9em; }
        .upload-area .preview { max-width: 100%; max-height: 200px; border-radius: 6px; margin-top: 8px; }
        .upload-area.done { border-color: #52c41a; border-style: solid; }
        .crop-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }
        .crop-container img { max-width: 100%; display: block; }
        .crop-overlay {
            position: absolute;
            border: 2px solid #4a90d9;
            background: rgba(74, 144, 217, 0.1);
            cursor: move;
        }
        .crop-handle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #4a90d9;
            border-radius: 50%;
        }
        .crop-handle.nw { top: -10px; left: -10px; cursor: nw-resize; }
        .crop-handle.ne { top: -10px; right: -10px; cursor: ne-resize; }
        .crop-handle.sw { bottom: -10px; left: -10px; cursor: sw-resize; }
        .crop-handle.se { bottom: -10px; right: -10px; cursor: se-resize; }
        .btn {
            display: block; width: 100%; padding: 14px;
            background: #4a90d9; color: #fff; border: none;
            border-radius: 10px; font-size: 1.05em; font-weight: 600;
            cursor: pointer; margin-bottom: 10px;
        }
        .btn:disabled { background: #ccc; }
        .btn-secondary {
            background: #52c41a;
        }
        .status {
            text-align: center; padding: 10px; margin: 12px 0;
            border-radius: 8px; font-size: 0.9em; display: none;
        }
        .status.show { display: block; }
        .status.loading { background: #e6f7ff; color: #1890ff; }
        .status.success { background: #f6ffed; color: #52c41a; }
        .result-card { display: none; }
        .result-card.show { display: block; }
        .result-img { width: 100%; border-radius: 8px; border: 1px solid #eee; background: #fff; }
        .download-btn {
            display: block; width: 100%; padding: 12px; margin-top: 10px;
            background: #52c41a; color: #fff; border: none;
            border-radius: 10px; font-size: 1em; font-weight: 600;
            text-align: center; text-decoration: none;
        }
        .tips { font-size: 0.8em; color: #999; line-height: 1.6; }
        .tips li { margin-bottom: 2px; }
        .step { display: none; }
        .step.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🪪 身份证照片处理</h1>
        <p class="subtitle">上传照片后框选身份证区域，生成 A4 打印图</p>

        <!-- 步骤1: 上传正面 -->
        <div class="card step active" id="step1">
            <h2>📤 第1步：上传正面照片</h2>
            <div class="upload-area" id="front-area" onclick="document.getElementById('front-input').click()">
                <div class="icon">📷</div>
                <div class="text">点击选择正面照片</div>
                <input type="file" id="front-input" accept="image/jpeg,image/png,image/jpg" onchange="handleUpload(this, 'front')">
            </div>
        </div>

        <!-- 步骤2: 裁剪正面 -->
        <div class="card step" id="step2">
            <h2>✂️ 第2步：框选正面身份证</h2>
            <p style="font-size:0.85em;color:#666;margin-bottom:10px;">拖动蓝色框的四个角，对准身份证四个角</p>
            <div id="front-crop-container"></div>
            <button class="btn btn-secondary" onclick="confirmCrop('front')">✅ 确认裁剪</button>
        </div>

        <!-- 步骤3: 上传背面 -->
        <div class="card step" id="step3">
            <h2>📤 第3步：上传背面照片</h2>
            <div class="upload-area" id="back-area" onclick="document.getElementById('back-input').click()">
                <div class="icon">📷</div>
                <div class="text">点击选择背面照片</div>
                <input type="file" id="back-input" accept="image/jpeg,image/png,image/jpg" onchange="handleUpload(this, 'back')">
            </div>
        </div>

        <!-- 步骤4: 裁剪背面 -->
        <div class="card step" id="step4">
            <h2>✂️ 第4步：框选背面身份证</h2>
            <p style="font-size:0.85em;color:#666;margin-bottom:10px;">拖动蓝色框的四个角，对准身份证四个角</p>
            <div id="back-crop-container"></div>
            <button class="btn btn-secondary" onclick="confirmCrop('back')">✅ 确认裁剪</button>
        </div>

        <!-- 步骤5: 生成结果 -->
        <div class="card step" id="step5">
            <h2>🚀 第5步：生成 A4 图片</h2>
            <button class="btn" onclick="generateA4()">生成 A4 打印图</button>
        </div>

        <div class="status" id="status-msg"></div>

        <div class="card result-card" id="result-section">
            <h2>📄 A4 拼接结果</h2>
            <p style="font-size:0.8em;color:#999;margin-bottom:8px;">长按图片保存或点击下载</p>
            <canvas id="result-canvas" class="result-img"></canvas>
            <a class="download-btn" id="download-btn" download="身份证_A4.png">📥 下载 A4 图片</a>
            <button class="btn" onclick="location.reload()" style="margin-top:10px;">🔄 重新制作</button>
        </div>

        <div class="card">
            <h2>💡 使用说明</h2>
            <ul class="tips">
                <li>• 上传照片后，会出现蓝色框</li>
                <li>• 拖动四个角，对准身份证边缘</li>
                <li>• 确认后上传另一张照片</li>
                <li>• 最后点击生成 A4 图片</li>
            </ul>
        </div>
    </div>

    <script src="https://docs.opencv.org/4.9.0/opencv.js"></script>
    <script>
        let frontImage = null, backImage = null;
        let frontCrop = null, backCrop = null;

        function handleUpload(input, side) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    if (side === 'front') {
                        frontImage = img;
                        showCropUI('front', img);
                        showStep('step2');
                    } else {
                        backImage = img;
                        showCropUI('back', img);
                        showStep('step4');
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function showStep(stepId) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
        }

        function showCropUI(side, img) {
            const container = document.getElementById(side + '-crop-container');
            container.innerHTML = '';
            
            const wrapper = document.createElement('div');
            wrapper.className = 'crop-container';
            wrapper.appendChild(img.cloneNode());
            
            const overlay = document.createElement('div');
            overlay.className = 'crop-overlay';
            overlay.id = side + '-overlay';
            
            // 默认框选区域（居中，身份证比例）
            const rect = img.getBoundingClientRect ? {width: img.width, height: img.height} : {width: 300, height: 200};
            const ratio = 85.6 / 54;
            let w = rect.width * 0.7;
            let h = w / ratio;
            if (h > rect.height * 0.7) {
                h = rect.height * 0.7;
                w = h * ratio;
            }
            const x = (rect.width - w) / 2;
            const y = (rect.height - h) / 2;
            
            overlay.style.left = x + 'px';
            overlay.style.top = y + 'px';
            overlay.style.width = w + 'px';
            overlay.style.height = h + 'px';
            
            ['nw', 'ne', 'sw', 'se'].forEach(pos => {
                const handle = document.createElement('div');
                handle.className = 'crop-handle ' + pos;
                overlay.appendChild(handle);
            });
            
            wrapper.appendChild(overlay);
            container.appendChild(wrapper);
            
            // 简单的拖动支持
            setupDrag(overlay, side);
        }

        function setupDrag(overlay, side) {
            let isDragging = false;
            let startX, startY, startLeft, startTop;
            
            overlay.addEventListener('touchstart', (e) => {
                if (e.target.classList.contains('crop-handle')) return;
                isDragging = true;
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                startLeft = parseInt(overlay.style.left);
                startTop = parseInt(overlay.style.top);
            });
            
            overlay.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                e.preventDefault();
                const touch = e.touches[0];
                overlay.style.left = (startLeft + touch.clientX - startX) + 'px';
                overlay.style.top = (startTop + touch.clientY - startY) + 'px';
            });
            
            overlay.addEventListener('touchend', () => isDragging = false);
            
            // 缩放支持
            const handles = overlay.querySelectorAll('.crop-handle');
            handles.forEach(handle => {
                let isResizing = false;
                handle.addEventListener('touchstart', (e) => {
                    isResizing = true;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                });
                handle.addEventListener('touchmove', (e) => {
                    if (!isResizing) return;
                    e.preventDefault();
                    // 简化版：只支持整体移动
                });
                handle.addEventListener('touchend', () => isResizing = false);
            });
        }

        function confirmCrop(side) {
            const overlay = document.getElementById(side + '-overlay');
            const crop = {
                x: parseInt(overlay.style.left),
                y: parseInt(overlay.style.top),
                w: parseInt(overlay.style.width),
                h: parseInt(overlay.style.height)
            };
            
            if (side === 'front') {
                frontCrop = crop;
                showStep('step3');
            } else {
                backCrop = crop;
                showStep('step5');
            }
        }

        function generateA4() {
            if (!frontImage || !backImage || !frontCrop || !backCrop) return;

            showStatus('正在生成...', 'loading');

            // A4 at 150 DPI: 1240 x 1754
            const a4W = 1240, a4H = 1754;
            const cardW = 506, cardH = 319;
            const gap = 118;

            const canvas = document.getElementById('result-canvas');
            canvas.width = a4W;
            canvas.height = a4H;
            const ctx = canvas.getContext('2d');

            // 白色背景
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, a4W, a4H);

            // 计算居中位置
            const totalH = cardH * 2 + gap;
            const startY = Math.round((a4H - totalH) / 2);
            const startX = Math.round((a4W - cardW) / 2);

            // 绘制正面
            ctx.drawImage(frontImage, frontCrop.x, frontCrop.y, frontCrop.w, frontCrop.h, startX, startY, cardW, cardH);

            // 绘制背面
            const backY = startY + cardH + gap;
            ctx.drawImage(backImage, backCrop.x, backCrop.y, backCrop.w, backCrop.h, startX, backY, cardW, cardH);

            // 设置下载链接
            const dataURL = canvas.toDataURL('image/png');
            document.getElementById('download-btn').href = dataURL;

            document.getElementById('result-section').classList.add('show');
            showStatus('✅ 生成成功！', 'success');
        }

        function showStatus(msg, type) {
            const el = document.getElementById('status-msg');
            el.textContent = msg;
            el.className = 'status show ' + type;
        }
    </script>
</body>
</html>
